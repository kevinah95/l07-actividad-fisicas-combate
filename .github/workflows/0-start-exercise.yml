name: Iniciar ejercicio

on:
  push:
    branches:
      - main

jobs:
  start_exercise:
    name: Crear issue de ejercicio
    runs-on: ubuntu-latest
    if: |
      !github.event.repository.is_template && !contains(github.event.head_commit.message, 'paso-')
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crear labels base si no existen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "ejercicio" --color "0075ca" --description "Issue del ejercicio guiado" 2>/dev/null || true
          gh label create "paso-1" --color "d93f0b" --description "Paso 1 activo" 2>/dev/null || true
          gh label create "paso-2" --color "fbca04" --description "Paso 2 activo" 2>/dev/null || true
          gh label create "paso-3" --color "0e8a16" --description "Paso 3 activo" 2>/dev/null || true
          gh label create "paso-4" --color "1d76db" --description "Paso 4 activo" 2>/dev/null || true
          gh label create "completado" --color "2ea44f" --description "Ejercicio completado" 2>/dev/null || true

      - name: Verificar si el issue ya existe
        id: check_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_COUNT=$(gh issue list --label "ejercicio" --state open --json number | jq length)
          echo "issue_count=$ISSUE_COUNT" >> "$GITHUB_OUTPUT"

      - name: Obtener repositorio plantilla
        if: steps.check_issue.outputs.issue_count == '0'
        id: get-template-repo
        uses: actions/github-script@v7
        with:
          script: |
            const { data: repo } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            if (repo.template_repository) {
              const issueReportUrl = `https://github.com/${repo.template_repository.full_name}/issues`;
              core.setOutput('ISSUE_REPORT_URL', issueReportUrl);
            }

      - name: Construir mensaje de bienvenida desde plantilla
        if: steps.check_issue.outputs.issue_count == '0'
        id: build-issue-description
        uses: skills/action-text-variables@v4
        with:
          template-file: .github/step-feedback/welcome.md
          template-vars: |
            title: "Práctica 07: Físicas 2D, Proyectiles y Combate"
            login: ${{ github.actor }}
            intro_message: "En esta práctica aprenderás a construir el motor de físicas 2D, máscaras de bits, colisiones AABB y proyectiles para **Norman The Necromancer** en Kotlin Multiplatform."
            bug_report_url: ${{ steps.get-template-repo.outputs.ISSUE_REPORT_URL || '' }}

      - name: Crear issue con el Paso 1
        if: steps.check_issue.outputs.issue_count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WELCOME_CONTENT: ${{ steps.build-issue-description.outputs.updated-text }}
        run: |
          STEP1_CONTENT=$(cat .github/steps/1-step.md)
          gh issue create \
            --title "Práctica 07: Físicas 2D, Proyectiles y Combate — Ejercicio Paso a Paso" \
            --label "ejercicio,paso-1" \
            --body "$WELCOME_CONTENT"$'\n\n'"$STEP1_CONTENT"
